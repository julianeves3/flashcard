
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilos.css">

    <title>Veja Aí</title>
</head>

<body>

    <header class="cabecalho">
        <h1>Veja Aí</h1>

        <nav>
            <a href="#">Início</a>
        </nav>
    </header>

    <main>
        <h2>Descubra a verdade passando o mouse</h2>

        <section>

            <!-- Primeiro cartão -->
            <article class="cartao">
                <div class="cartao-interno">

                    <div class="cartao-frente">
                        <img
                            src="https://wallpapers.com/images/hd/milky-way-pictures-ppr2bwt990c7ltdz.jpg"
                            alt="Via Láctea"
                            class="cartao-imagem"
                        >

                        <p>
                            Mito: A Via Láctea é a única galáxia
                            que existe no Universo.
                        </p>
                    </div>

                    <div class="cartao-verso">
                        <img
                            src="https://wallpapers.com/images/hd/milky-way-pictures-ppr2bwt990c7ltdz.jpg"
                            alt="Via Láctea"
                            class="cartao-imagem"
                        >

                        <p>
                            Verdade: Existem bilhões de outras
                            galáxias no Universo.
                        </p>
                    </div>

                </div>
            </article>

            <!-- Segundo cartão -->
            <article class="cartao">
                <div class="cartao-interno">

                    <div class="cartao-frente">
                        <img
                            src="https://wallpapers.com/images/hd/milky-way-pictures-ppr2bwt990c7ltdz.jpg"
                            alt="Via Láctea no espaço"
                            class="cartao-imagem"
                        >

                        <p>
                            Mito: A Via Láctea tem formato
                            de uma linha reta.
                        </p>
                    </div>

                    <div class="cartao-verso">
                        <img
                            src="https://wallpapers.com/images/hd/milky-way-pictures-ppr2bwt990c7ltdz.jpg"
                            alt="Galáxia Via Láctea"
                            class="cartao-imagem"
                        >

                        <p>
                            Verdade: A Via Láctea é uma galáxia
                            espiral barrada.
                        </p>
                    </div>

                </div>
            </article>

        </section>
    </main>

    <footer>
        Projeto Veja Aí
    </footer>

</body>

</html>
</body>
</html>
